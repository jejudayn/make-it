<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyTalk - Daily English Journal & Kakao Auth</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .dark body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .light body {
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="light">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 오늘 날짜 YYYY-MM-DD
        const getTodayString = () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        };

        // 추천 예시 일기
        const SAMPLE_JOURNALS = [
            {
                title: "☕ 카페에서의 공부",
                text: "Today I visited a quiet coffee shop near my home to practice English writing. I ordered a hot cafe latte and spent two hours reviewing new expressions. Working in a cozy environment helped me concentrate much better than usual."
            },
            {
                title: "💼 회사 업무 및 회의",
                text: "We had an important team sync meeting today. I tried to speak up in English during the presentation. Even though I felt a bit nervous at first, my teammates supported me, which gave me more confidence."
            },
            {
                title: "🏋️ 오운완 & 운동",
                text: "I went for an evening jog in the park. The weather was crisp and refreshing. Listening to an English podcast while running turned out to be a great way to combine exercise with learning!"
            }
        ];

        // AI 로컬 분석 및 교정 함수
        const analyzeInputTextLocally = (rawText) => {
            if (!rawText || !rawText.trim()) return null;

            let beginnerText = rawText;
            let intermediateText = rawText;
            let explanations = [];
            let idioms = [];

            if (/woke up at/i.test(rawText)) {
                intermediateText = intermediateText.replace(/woke up at ([\d:]+\s*(?:AM|PM)?)/gi, "got up right around $1");
                explanations.push({
                    original: "woke up at ...",
                    changed: "got up right around ...",
                    desc: "단순한 눈뜸보다 침대에서 일어나 일과를 시작하는 구동사 'get up'과 부드러운 시간 표현 'right around'를 활용했습니다."
                });
            }

            if (/prepare breakfast|prepare lunch/i.test(rawText)) {
                intermediateText = intermediateText.replace(/prepare breakfast/gi, "whip up breakfast").replace(/prepare lunch/gi, "pack lunch");
                explanations.push({
                    original: "prepare breakfast",
                    changed: "whip up breakfast",
                    desc: "'준비하다(prepare)' 대신 음식을 뚝딱 차려내는 원어민 구동사 'whip up'을 적용했습니다."
                });
                idioms.push({
                    phrase: "Whip up (음식을 뚝딱 차리다)",
                    example: `"I whipped up a quick meal before starting my English journal."`
                });
            }

            if (explanations.length === 0) {
                intermediateText = rawText
                    .replace(/\bwent to\b/gi, 'headed over to')
                    .replace(/\bhappy\b/gi, 'delighted')
                    .replace(/\bbusy\b/gi, 'tied up with tasks')
                    .replace(/\bgood\b/gi, 'fantastic');

                explanations.push({
                    original: "일반 기초 어휘",
                    changed: "세련된 구동사 및 원어민 표현",
                    desc: "문맥에 맞춰 더 자연스럽고 풍부한 단어 조합으로 교정했습니다."
                });
                idioms.push({
                    phrase: "Make it a habit (습관으로 만들다)",
                    example: `"Writing a daily English journal helps make learning a habit."`
                });
            }

            if (idioms.length === 0) {
                idioms.push({
                    phrase: "Stay on track (계획대로 꾸준히 해나가다)",
                    example: `"Keeping a daily record helps me stay on track with my English goals."`
                });
            }

            return {
                beginner: beginnerText,
                beginnerTip: "기본 주어+동사 구성을 깔끔하게 다듬고 가독성을 높였습니다.",
                intermediate: intermediateText,
                intermediateTip: "원어민이 즐겨 사용하는 구동사(Phrasal Verbs)와 문맥 연결어를 강화했습니다.",
                explanations,
                idioms,
                dialogue: [
                    { speaker: "A (Study Partner)", text: "How did your English study go today?" },
                    { speaker: "B (You)", text: intermediateText.split('.')[0] + "." || "I had a productive study session!" }
                ]
            };
        };

        function App() {
            // 다크 모드
            const [isDarkMode, setIsDarkMode] = useState(false);

            // 입력 폼 상태
            const [participantName, setParticipantName] = useState(() => localStorage.getItem('dt_user_name') || '김영어');
            const [studyDate, setStudyDate] = useState(getTodayString());
            const [todayLearning, setTodayLearning] = useState('');
            const [todayJournal, setTodayJournal] = useState('');
            const [todayReflection, setTodayReflection] = useState('');
            const [editingId, setEditingId] = useState(null); // 수정 모드 시 해당 항목 ID

            // 저장된 일기 데이터 목록 (localStorage 연동)
            const [journals, setJournals] = useState(() => {
                const saved = localStorage.getItem('dt_journal_list');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [
                    {
                        id: 'sample-1',
                        name: '김영어',
                        date: getTodayString(),
                        learning: 'whip up (음식을 뚝딱 차리다), stay on track',
                        journal: `Today I visited a quiet coffee shop near my home to practice English writing. I ordered a hot cafe latte and spent two hours reviewing new expressions.\nWorking in a cozy environment helped me concentrate much better than usual. I feel great about making steady progress every single day!`,
                        reflection: '꾸준히 하루 10분씩 일기 작성하는 습관을 들이자.',
                        createdAt: Date.now()
                    }
                ];
            });

            // 독립적인 작성/인증 완료 날짜 히스토리 (일기가 삭제되어도 캘린더 및 통계에 잔존)
            const [completedDates, setCompletedDates] = useState(() => {
                const savedHistory = localStorage.getItem('dt_completed_dates');
                if (savedHistory) {
                    try { return JSON.parse(savedHistory); } catch(e) {}
                }
                // 기본 초기값은 기존 일기 목록의 날짜들
                return [getTodayString()];
            });

            // 알림 토스트 상태
            const [toastMessage, setToastMessage] = useState(null);
            const [copiedSuccess, setCopiedSuccess] = useState(false);

            // 캘린더 현재 조회 연/월 상태
            const [currentCalDate, setCurrentCalDate] = useState(new Date());

            // 이름 변경 시 localStorage 저장
            useEffect(() => {
                localStorage.setItem('dt_user_name', participantName);
            }, [participantName]);

            // 일기 목록 변경 시 localStorage 저장
            useEffect(() => {
                localStorage.setItem('dt_journal_list', JSON.stringify(journals));
            }, [journals]);

            // 인증 완료 날짜 기록 변경 시 localStorage 저장
            useEffect(() => {
                localStorage.setItem('dt_completed_dates', JSON.stringify(completedDates));
            }, [completedDates]);

            // 토스트 출력 함수
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // 일기 저장 또는 수정 처리
            const handleSaveJournal = (e) => {
                if (e) e.preventDefault();

                if (!participantName.trim()) {
                    showToast('⚠️ 참여자 이름을 입력해주세요.');
                    return;
                }
                if (!todayJournal.trim()) {
                    showToast('⚠️ 오늘의 영어 일기 내용(Today\'s Journal)을 작성해주세요.');
                    return;
                }

                // 해당 학습 날짜를 completedDates 인증 히스토리에 추가 (중복 방지)
                if (!completedDates.includes(studyDate)) {
                    setCompletedDates(prev => [...prev, studyDate]);
                }

                if (editingId) {
                    // 기존 일기 수정
                    setJournals(prev => prev.map(item => {
                        if (item.id === editingId) {
                            return {
                                ...item,
                                name: participantName,
                                date: studyDate,
                                learning: todayLearning,
                                journal: todayJournal,
                                reflection: todayReflection,
                                updatedAt: Date.now()
                            };
                        }
                        return item;
                    }));
                    setEditingId(null);
                    showToast('✅ 일기가 성공적으로 수정되었습니다!');
                } else {
                    // 새 일기 작성 및 저장
                    const newEntry = {
                        id: 'j-' + Date.now(),
                        name: participantName,
                        date: studyDate,
                        learning: todayLearning,
                        journal: todayJournal,
                        reflection: todayReflection,
                        createdAt: Date.now()
                    };
                    setJournals(prev => [newEntry, ...prev]);
                    showToast('🎉 오늘의 일기가 저장되고 학습 인증이 완료되었습니다!');
                }
            };

            // 선택한 일기 불러오기 (수정/조회)
            const handleLoadJournal = (entry) => {
                setEditingId(entry.id);
                setParticipantName(entry.name || '');
                setStudyDate(entry.date || getTodayString());
                setTodayLearning(entry.learning || '');
                setTodayJournal(entry.journal || '');
                setTodayReflection(entry.reflection || '');
                showToast(`📅 ${entry.date} 일기를 불러왔습니다.`);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // 일기 삭제 (목록에서만 삭제되고, completedDates 캘린더 기록은 유지됨)
            const handleDeleteJournal = (id) => {
                if (window.confirm('일기 내용은 삭제되지만, 캘린더의 출석/작성 완료 기록은 유지됩니다. 삭제하시겠습니까?')) {
                    setJournals(prev => prev.filter(j => j.id !== id));
                    if (editingId === id) {
                        handleResetForm();
                    }
                    showToast('🗑️ 일기가 목록에서 삭제되었습니다. (캘린더 기록 유지)');
                }
            };

            // 입력 폼 초기화 (새 일기 쓰기)
            const handleResetForm = () => {
                setEditingId(null);
                setStudyDate(getTodayString());
                setTodayLearning('');
                setTodayJournal('');
                setTodayReflection('');
            };

            // 카카오톡 인증 메시지 복사 기능
            const handleCopyKakaoAuthMessage = () => {
                if (!todayJournal || !todayJournal.trim()) {
                    showToast('⚠️ 작성된 일기가 없습니다. 일기를 작성한 후 복사해주세요!');
                    return;
                }

                const formattedMessage = 
`🌱 Make It Mine | Daily English Journal
📅 Date: ${studyDate || getTodayString()}
👤 Name: ${participantName || '학습자'}

📚 Today's Learning
${todayLearning.trim() ? todayLearning.trim() : 'N/A'}

📝 Today's Journal
${todayJournal.trim()}

💭 Today's Reflection
${todayReflection.trim() ? todayReflection.trim() : 'N/A'}

✅ Daily Study Complete!`;

                // 클립보드 복사 실행
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(formattedMessage).then(() => {
                        setCopiedSuccess(true);
                        showToast('📋 카카오톡 단체방 인증 메시지가 복사되었습니다!');
                        setTimeout(() => setCopiedSuccess(false), 2000);
                    }).catch(() => {
                        fallbackCopyText(formattedMessage);
                    });
                } else {
                    fallbackCopyText(formattedMessage);
                }
            };

            const fallbackCopyText = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopiedSuccess(true);
                    showToast('📋 카카오톡 단체방 인증 메시지가 복사되었습니다!');
                    setTimeout(() => setCopiedSuccess(false), 2000);
                } catch (err) {
                    showToast('❌ 복사에 실패했습니다.');
                }
                document.body.removeChild(textArea);
            };

            // 다크모드 토글
            const toggleDarkMode = () => {
                setIsDarkMode(!isDarkMode);
                document.body.classList.toggle('dark');
                document.body.classList.toggle('light');
            };

            // 통계 산출 (completedDates 기준)
            const uniqueDates = Array.from(new Set(completedDates));
            const totalAuthDays = uniqueDates.length;
            const isTodayAuthed = uniqueDates.includes(getTodayString());

            // 캘린더 관련 계산
            const calYear = currentCalDate.getFullYear();
            const calMonth = currentCalDate.getMonth(); // 0-indexed
            const firstDayOfMonth = new Date(calYear, calMonth, 1).getDay(); // 0: Sun
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

            const prevMonth = () => {
                setCurrentCalDate(new Date(calYear, calMonth - 1, 1));
            };
            const nextMonth = () => {
                setCurrentCalDate(new Date(calYear, calMonth + 1, 1));
            };

            // 년도 / 월 드롭다운 선택 변경 처리
            const handleYearChange = (e) => {
                const newYear = parseInt(e.target.value, 10);
                setCurrentCalDate(new Date(newYear, calMonth, 1));
            };

            const handleMonthChange = (e) => {
                const newMonth = parseInt(e.target.value, 10);
                setCurrentCalDate(new Date(calYear, newMonth, 1));
            };

            // 주간 인증 횟수 (최근 7일)
            const todayObj = new Date();
            const past7Days = Array.from({length: 7}, (_, i) => {
                const d = new Date();
                d.setDate(todayObj.getDate() - i);
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            });
            const weeklyCount = past7Days.filter(dateStr => uniqueDates.includes(dateStr)).length;
            const achievementRate = Math.round((weeklyCount / 7) * 100);

            // 연속 달성일(Streak) 계산
            let streak = 0;
            let checkDate = new Date();
            while (true) {
                const yyyy = checkDate.getFullYear();
                const mm = String(checkDate.getMonth() + 1).padStart(2, '0');
                const dd = String(checkDate.getDate()).padStart(2, '0');
                const dStr = `${yyyy}-${mm}-${dd}`;
                if (uniqueDates.includes(dStr)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else if (streak === 0 && dStr === getTodayString()) {
                    // 오늘 아직 안 썼으면 어제부터 카운트
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }

            return (
                <div className={`min-h-screen pb-16 transition-colors duration-300 ${isDarkMode ? 'bg-slate-900 text-slate-100' : 'bg-slate-50 text-slate-800'}`}>
                    
                    {/* Floating Toast Notification */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-800 text-white font-medium text-sm px-4 py-3 rounded-xl shadow-xl border border-slate-700 flex items-center space-x-2 animate-bounce">
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Top Navigation Header */}
                    <header className={`border-b px-6 py-3.5 flex items-center justify-between sticky top-0 z-20 backdrop-blur-md ${isDarkMode ? 'bg-slate-900/90 border-slate-800' : 'bg-white/90 border-gray-200'}`}>
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-500/20">
                                📖
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight leading-none">Make It Mine</h1>
                                <p className="text-xs text-gray-400 mt-1 font-medium">Daily English Journal & Kakao Verification</p>
                            </div>
                        </div>

                        <div className="flex items-center space-x-3">
                            <span className={`text-xs font-bold px-3 py-1.5 rounded-full border flex items-center gap-1.5 shadow-sm ${isTodayAuthed ? 'bg-emerald-500/10 text-emerald-600 border-emerald-500/20' : 'bg-amber-500/10 text-amber-600 border-amber-500/20'}`}>
                                {isTodayAuthed ? '✅ 오늘 인증 완료' : '✍️ 오늘 인증 미완료'} |🔥 {streak}일 연속
                            </span>

                            <button
                                onClick={toggleDarkMode}
                                className={`p-2 rounded-xl border text-sm font-semibold transition ${isDarkMode ? 'bg-slate-800 border-slate-700 text-yellow-400 hover:bg-slate-700' : 'bg-gray-100 border-gray-200 text-slate-700 hover:bg-gray-200'}`}
                                title="테마 변경"
                            >
                                {isDarkMode ? '🌙' : '☀️'}
                            </button>
                        </div>
                    </header>

                    {/* Main Container */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                        
                        {/* Summary Metrics Bar */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div className={`p-4 rounded-2xl border transition shadow-sm ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                                <div className="text-xs font-semibold text-gray-400">🔥 연속 학습 달성</div>
                                <div className="text-2xl font-black mt-1 text-indigo-500">{streak}일 연속</div>
                            </div>
                            <div className={`p-4 rounded-2xl border transition shadow-sm ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                                <div className="text-xs font-semibold text-gray-400">📅 이번 주 인증 횟수</div>
                                <div className="text-2xl font-black mt-1 text-emerald-500">{weeklyCount} / 7회</div>
                            </div>
                            <div className={`p-4 rounded-2xl border transition shadow-sm ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                                <div className="text-xs font-semibold text-gray-400">🎯 주간 달성률</div>
                                <div className="text-2xl font-black mt-1 text-amber-500">{achievementRate}%</div>
                            </div>
                            <div className={`p-4 rounded-2xl border transition shadow-sm ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                                <div className="text-xs font-semibold text-gray-400">📚 총 출석/인증일</div>
                                <div className="text-2xl font-black mt-1 text-sky-500">{totalAuthDays}일 달성</div>
                            </div>
                        </div>

                        {/* Calendar Section (일기가 삭제되어도 기록했던 날은 녹색 표시 유지) */}
                        <div className={`p-6 rounded-2xl border transition shadow-sm mb-6 ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                                <div className="flex items-center space-x-2">
                                    <span className="text-indigo-500 text-xl">📅</span>
                                    <h2 className="font-bold text-lg">학습 현황 캘린더</h2>
                                    <span className="text-xs text-gray-400 ml-2 font-normal hidden md:inline">(일기를 작성했던 날은 삭제 후에도 녹색으로 유지됩니다)</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <button 
                                        onClick={prevMonth}
                                        className={`p-1.5 px-2.5 rounded-lg border text-xs font-bold transition ${isDarkMode ? 'bg-slate-900 border-slate-700 hover:bg-slate-700' : 'bg-gray-100 border-gray-200 hover:bg-gray-200'}`}
                                        title="이전달"
                                    >
                                        ◀
                                    </button>

                                    {/* 년도 선택 드롭다운 */}
                                    <select
                                        value={calYear}
                                        onChange={handleYearChange}
                                        className={`p-1.5 px-2 rounded-lg border text-xs font-bold transition cursor-pointer ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-800'}`}
                                    >
                                        {Array.from({ length: 11 }, (_, i) => 2020 + i).map((year) => (
                                            <option key={year} value={year}>
                                                {year}년
                                            </option>
                                        ))}
                                    </select>

                                    {/* 월 선택 드롭다운 */}
                                    <select
                                        value={calMonth}
                                        onChange={handleMonthChange}
                                        className={`p-1.5 px-2 rounded-lg border text-xs font-bold transition cursor-pointer ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-800'}`}
                                    >
                                        {Array.from({ length: 12 }, (_, i) => i).map((month) => (
                                            <option key={month} value={month}>
                                                {month + 1}월
                                            </option>
                                        ))}
                                    </select>

                                    <button 
                                        onClick={nextMonth}
                                        className={`p-1.5 px-2.5 rounded-lg border text-xs font-bold transition ${isDarkMode ? 'bg-slate-900 border-slate-700 hover:bg-slate-700' : 'bg-gray-100 border-gray-200 hover:bg-gray-200'}`}
                                        title="다음달"
                                    >
                                        ▶
                                    </button>
                                </div>
                            </div>

                            {/* Calendar Grid */}
                            <div className="grid grid-cols-7 gap-2 text-center">
                                {['일', '월', '화', '수', '목', '금', '토'].map((day, idx) => (
                                    <div key={day} className={`text-xs font-bold py-1 ${idx === 0 ? 'text-red-400' : idx === 6 ? 'text-sky-400' : 'text-gray-400'}`}>
                                        {day}
                                    </div>
                                ))}

                                {/* 빈 날짜 칸 */}
                                {Array.from({ length: firstDayOfMonth }).map((_, i) => (
                                    <div key={`empty-${i}`} className="h-11 sm:h-14 rounded-xl"></div>
                                ))}

                                {/* 해당 월 날짜 칸 */}
                                {Array.from({ length: daysInMonth }).map((_, i) => {
                                    const dayNum = i + 1;
                                    const mmStr = String(calMonth + 1).padStart(2, '0');
                                    const ddStr = String(dayNum).padStart(2, '0');
                                    const dateStr = `${calYear}-${mmStr}-${ddStr}`;
                                    const isWritten = completedDates.includes(dateStr);
                                    const isToday = dateStr === getTodayString();
                                    const matchingJournal = journals.find(j => j.date === dateStr);

                                    return (
                                        <div
                                            key={dateStr}
                                            onClick={() => {
                                                if (matchingJournal) {
                                                    handleLoadJournal(matchingJournal);
                                                } else {
                                                    setStudyDate(dateStr);
                                                    if (isWritten) {
                                                        showToast(`📅 ${dateStr}에 기록된 일기 원본은 삭제되었지만, 출석 기록은 유지 중입니다.`);
                                                    } else {
                                                        showToast(`📅 ${dateStr} 날짜가 선택되었습니다.`);
                                                    }
                                                }
                                            }}
                                            className={`h-11 sm:h-14 rounded-xl border p-1 sm:p-2 flex flex-col justify-between items-center cursor-pointer transition relative group ${
                                                isWritten
                                                    ? 'bg-emerald-500 text-white border-emerald-600 shadow-sm font-bold hover:scale-105'
                                                    : isDarkMode
                                                        ? 'bg-slate-900/60 border-slate-700/80 text-gray-300 hover:border-indigo-500'
                                                        : 'bg-gray-50 border-gray-200 text-gray-700 hover:border-indigo-400'
                                            } ${isToday && !isWritten ? 'ring-2 ring-indigo-500' : ''}`}
                                        >
                                            <span className="text-xs sm:text-sm font-bold leading-none">
                                                {dayNum}
                                            </span>
                                            {isWritten ? (
                                                <span className="text-[10px] bg-emerald-700/60 px-1.5 py-0.5 rounded-full text-white font-medium">
                                                    완료
                                                </span>
                                            ) : (
                                                <span className="text-[10px] text-gray-400 font-normal">
                                                    {isToday ? '오늘' : ''}
                                                </span>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

                            {/* LEFT COLUMN: 영어 일기 작성 폼 */}
                            <div className="lg:col-span-6 space-y-5">
                                <div className={`rounded-2xl p-6 border transition shadow-sm ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                                    
                                    {/* Section Title & Header */}
                                    <div className="flex items-center justify-between pb-4 border-b border-gray-200/40">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-indigo-500 text-xl">📝</span>
                                            <h2 className="font-bold text-lg">
                                                {editingId ? '영어 일기 수정하기' : '오늘의 영어 일기 작성'}
                                            </h2>
                                        </div>
                                        {editingId && (
                                            <button 
                                                onClick={handleResetForm}
                                                className="text-xs bg-gray-500/10 text-gray-400 hover:text-gray-200 font-semibold px-2.5 py-1 rounded-lg border border-gray-500/20"
                                            >
                                                ✕ 작성 취소 (새 일기)
                                            </button>
                                        )}
                                    </div>

                                    {/* Form Fields */}
                                    <form onSubmit={handleSaveJournal} className="mt-5 space-y-4">
                                        
                                        {/* 1. 참여자 이름 & 2. 학습 날짜 */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block mb-1">
                                                    👤 참여자 이름 <span className="text-red-400">*</span>
                                                </label>
                                                <input
                                                    type="text"
                                                    value={participantName}
                                                    onChange={(e) => setParticipantName(e.target.value)}
                                                    placeholder="이름 입력 (예: 김영어)"
                                                    className={`w-full p-3 border rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 transition ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-800'}`}
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block mb-1">
                                                    📅 학습 날짜 <span className="text-red-400">*</span>
                                                </label>
                                                <input
                                                    type="date"
                                                    value={studyDate}
                                                    onChange={(e) => setStudyDate(e.target.value)}
                                                    className={`w-full p-3 border rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 transition ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-800'}`}
                                                    required
                                                />
                                            </div>
                                        </div>

                                        {/* 3. 오늘 배운 문법 또는 표현 (선택) */}
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block mb-1">
                                                📚 오늘 배운 문법 또는 표현 <span className="text-xs text-gray-400 font-normal">(선택 사항)</span>
                                            </label>
                                            <input
                                                type="text"
                                                value={todayLearning}
                                                onChange={(e) => setTodayLearning(e.target.value)}
                                                placeholder="예: Whip up (뚝딱 만들다), In a rush (서둘러서)"
                                                className={`w-full p-3 border rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 transition ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-800'}`}
                                            />
                                        </div>

                                        {/* 샘플 주입 템플릿 버튼 */}
                                        <div>
                                            <span className="text-xs font-semibold text-gray-400 block mb-1.5">예시 일기 불러오기 (참고용):</span>
                                            <div className="flex flex-wrap gap-2">
                                                {SAMPLE_JOURNALS.map((sample, idx) => (
                                                    <button
                                                        key={idx}
                                                        type="button"
                                                        onClick={() => {
                                                            setTodayJournal(sample.text);
                                                            showToast(`'${sample.title}' 예시 문장이 입력되었습니다.`);
                                                        }}
                                                        className={`text-xs px-2.5 py-1.5 rounded-lg border font-medium transition ${isDarkMode ? 'bg-slate-900/60 border-slate-700 hover:border-indigo-500 text-gray-300' : 'bg-gray-100 border-gray-200 hover:bg-indigo-50 hover:border-indigo-300 text-gray-700'}`}
                                                    >
                                                        {sample.title}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* 4. Today's Journal (대형 메모 박스) */}
                                        <div>
                                            <div className="flex items-center justify-between mb-1">
                                                <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block">
                                                    ✍️ Today's Journal <span className="text-red-400">*</span>
                                                </label>
                                                <span className="text-xs text-gray-400 font-mono">{todayJournal.length} characters</span>
                                            </div>
                                            <textarea
                                                value={todayJournal}
                                                onChange={(e) => setTodayJournal(e.target.value)}
                                                placeholder="Write about what you learned or how you used English today... (줄바꿈 및 긴 문단을 자유롭게 입력하세요)"
                                                rows="9"
                                                className={`w-full p-4 border rounded-xl text-sm leading-relaxed resize-y focus:ring-2 focus:ring-indigo-500 transition font-normal ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100 placeholder-slate-500' : 'bg-white border-gray-300 text-gray-800 placeholder-gray-400'}`}
                                            />
                                        </div>

                                        {/* 5. 오늘의 짧은 회고 (선택) */}
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 dark:text-gray-400 block mb-1">
                                                💭 오늘의 짧은 회고 <span className="text-xs text-gray-400 font-normal">(선택 사항)</span>
                                            </label>
                                            <input
                                                type="text"
                                                value={todayReflection}
                                                onChange={(e) => setTodayReflection(e.target.value)}
                                                placeholder="예: 오늘은 카페에서 집중이 정말 잘 되었다. 내일도 꾸준히 쓰자!"
                                                className={`w-full p-3 border rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 transition ${isDarkMode ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-gray-300 text-gray-800'}`}
                                            />
                                        </div>

                                        {/* 버튼 그룹: 저장 및 카톡 복사 */}
                                        <div className="pt-2">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {/* 일기 저장 및 인증 완료 버튼 */}
                                                <button
                                                    type="submit"
                                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-md shadow-indigo-500/20 flex items-center justify-center space-x-2 text-sm"
                                                >
                                                    <span>💾 {editingId ? '일기 수정 완료' : '일기 저장 및 인증 완료'}</span>
                                                </button>

                                                {/* 카카오톡 인증 메시지 복사 버튼 */}
                                                <button
                                                    type="button"
                                                    onClick={handleCopyKakaoAuthMessage}
                                                    className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-md shadow-amber-500/20 flex items-center justify-center space-x-2 text-sm"
                                                >
                                                    <span>{copiedSuccess ? '✅ 복사 완료!' : '💬 카카오톡 인증 복사'}</span>
                                                </button>
                                            </div>
                                        </div>

                                    </form>

                                </div>
                            </div>

                            {/* RIGHT COLUMN: 작성 히스토리 목록 */}
                            <div className="lg:col-span-6 space-y-5">
                                
                                {/* 저장된 일기장 목록 & 날짜별 조회/수정/삭제 */}
                                <div className={`rounded-2xl p-6 border transition shadow-sm ${isDarkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-gray-200/80'}`}>
                                    <div className="flex items-center justify-between pb-4 border-b border-gray-200/40">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-indigo-500 text-xl">📚</span>
                                            <h2 className="font-bold text-lg">나의 일기 기록 (저장목록)</h2>
                                        </div>
                                        <span className="text-xs bg-indigo-500/10 text-indigo-500 font-bold px-2.5 py-1 rounded-full">
                                            총 {journals.length}개 저장됨
                                        </span>
                                    </div>

                                    <div className="mt-4 space-y-3 max-h-[650px] overflow-y-auto pr-1">
                                        {journals.length === 0 ? (
                                            <div className="text-center py-12 text-gray-400 text-xs">
                                                저장된 일기 본문이 없습니다. (삭제했거나 새 일기 미작성)
                                            </div>
                                        ) : (
                                            journals.map((item) => (
                                                <div 
                                                    key={item.id} 
                                                    className={`p-4 rounded-xl border transition ${editingId === item.id ? 'border-indigo-500 ring-2 ring-indigo-500/20' : isDarkMode ? 'bg-slate-900/50 border-slate-700 hover:border-slate-600' : 'bg-gray-50 border-gray-200 hover:bg-gray-100/70'}`}
                                                >
                                                    <div className="flex items-center justify-between mb-2">
                                                        <div className="flex items-center space-x-2">
                                                            <span className="text-xs font-bold text-indigo-500 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">
                                                                📅 {item.date}
                                                            </span>
                                                            <span className="text-xs font-bold text-gray-500">
                                                                👤 {item.name}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <button
                                                                onClick={() => handleLoadJournal(item)}
                                                                className="text-xs px-2.5 py-1 rounded bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition"
                                                            >
                                                                수정 / 불러오기
                                                            </button>
                                                            <button
                                                                onClick={() => handleDeleteJournal(item.id)}
                                                                className="text-xs px-2 py-1 rounded bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition font-semibold"
                                                            >
                                                                삭제
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {item.learning && (
                                                        <div className="text-xs text-amber-600 dark:text-amber-400 font-medium mb-1.5 flex items-center gap-1">
                                                            <span>📚 배운 표현:</span>
                                                            <span className="truncate">{item.learning}</span>
                                                        </div>
                                                    )}

                                                    <p className="text-xs text-gray-600 dark:text-gray-300 leading-relaxed whitespace-pre-wrap line-clamp-4 font-normal">
                                                        {item.journal}
                                                    </p>

                                                    {item.reflection && (
                                                        <div className="mt-2 text-xs italic text-gray-400 border-t border-gray-200/30 pt-1.5">
                                                            💭 회고: {item.reflection}
                                                        </div>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                            </div>

                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
